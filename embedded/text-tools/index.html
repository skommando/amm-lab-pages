<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AMM Text Tools</title>
    <script src="../tool-theme/runtime.js"></script>
    <link rel="stylesheet" href="../tool-theme/theme.css">
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--tool-canvas); color: var(--tool-text); }
      main { max-width: 1120px; margin: 0 auto; padding: 44px 20px; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0; }
      .panel { display: grid; grid-template-columns: 260px 1fr; gap: 18px; margin-top: 28px; }
      .tools { display: grid; gap: 8px; align-content: start; }
      button { min-height: 44px; border: 1px solid var(--tool-line); border-radius: 8px; background: var(--tool-panel); color: var(--tool-text); font-weight: 700; cursor: pointer; }
      button[aria-pressed="true"] { background: var(--tool-strong); color: var(--tool-on-strong); border-color: var(--tool-accent); }
      select { min-height: 44px; padding: 6px; border: 1px solid var(--tool-line); border-radius: 6px; }
      label { display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; }
      .actions { display: flex; gap: 8px; } .actions button { padding: 0 20px; }
      #status { min-height: 24px; color: var(--tool-secondary); overflow-wrap: anywhere; }
      textarea { min-height: 220px; border: 1px solid var(--tool-line); border-radius: 8px; padding: 14px; font: 14px/1.6 ui-monospace, Consolas, monospace; }
      .work { display: grid; gap: 12px; }
      .tool-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      select, textarea { background: var(--tool-inset); color: var(--tool-text); }
      #output { background: var(--tool-panel); }
      .work small, .work p, main > p { color: var(--tool-muted); }
      .tools button:hover, .actions button:hover { background: var(--tool-raised); }
      .tools button[aria-pressed="true"]:hover { background: var(--tool-strong-hover); }
      @media print { body { background: white; } }
      @media (max-width: 760px) { .panel { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header class="tool-header"><h1>文本工具箱</h1><button type="button" class="tool-theme-toggle" data-tool-theme-toggle>切换到暗色模式</button></header>
      <p>清理文本、HTML 和表格的小工具箱，所有处理都在浏览器本地完成。</p>
      <section class="panel">
        <div class="tools">
          <button data-tool="hash">哈希摘要</button>
          <button data-tool="base64">Base64 编解码</button>
          <button data-tool="normalize">清理空白</button>
          <button data-tool="strip">HTML 转文本</button>
          <button data-tool="clean">清理 HTML</button>
          <button data-tool="table">表格转 Markdown</button>
        </div>
        <div class="work">
          <div id="hash-options">
            <label>算法 <select id="algorithm"><option>MD5</option><option>SHA-1</option><option selected>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select></label>
            <label><input id="uppercase" type="checkbox">十六进制大写</label>
            <p>输入按原始 UTF-8 字节计算。MD5 / SHA-1 仅用于兼容与校验，不用于密码保护。</p>
          </div>
          <div id="base64-options" hidden><label>方向 <select id="direction"><option value="encode">编码</option><option value="decode">解码</option></select></label><p>Base64 是编码，保留标准大小写；解码接受标准补位及 ASCII 空白。</p></div>
          <textarea id="input" aria-label="输入"></textarea>
          <textarea id="output" aria-label="输出" readonly></textarea>
          <div class="actions"><button id="copy">复制输出</button><button id="clear">清空</button></div>
          <div id="status" role="status" aria-live="polite"></div>
          <small>HTML 清理仅用于整理代码，不是全面的安全消毒器。</small>
        </div>
      </section>
    </main>
    <script type="module" src="./src/ui.mjs"></script>
  </body>
</html>
